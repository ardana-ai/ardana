[workspace]
resolver = "3"
members = [
    "crates/ardana",
    "crates/ardana-api",
    "crates/ardana-candle",
    "crates/ardana-core",
    "crates/ardana-llama",
    "crates/ardana-registry",
    "crates/ardana-server",
    "crates/ardana-playground",
    "crates/ardana-engine",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/ardana-ai/ardana"
publish = false

[workspace.dependencies]
ardana-api = { path = "crates/ardana-api" }
ardana-candle = { path = "crates/ardana-candle" }
ardana-core = { path = "crates/ardana-core" }
ardana-llama = { path = "crates/ardana-llama" }
ardana-registry = { path = "crates/ardana-registry" }
ardana-server = { path = "crates/ardana-server" }
anyhow = "1"
axum = "0.8"
# The Candle runtime (`ardana-candle`), pinned together: the three crates release in lockstep. candle-core brings its
# own `tokenizers` 0.22 (`onig` only), which stays in the lock beside ardana's 0.23.2.
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
clap = { version = "4", features = ["derive"] }
hf-hub = "=1.0.0"
http-body = "1"
indexmap = { version = "2", features = ["serde"] }
llama-cpp-2 = { version = "=0.1.157", default-features = false }
minijinja = { version = "2.24.0", features = ["loop_controls"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "=0.23.2", default-features = false }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
lz-str = "0.2"
memory-serve = "2.4"
# The library document's GETs (`ardana-registry`), at the version hf-hub 1.0.0 resolves with the features it enables
# (its defaults: rustls), so the lock gains no crate.
reqwest = "=0.13.5"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: every number keeps its exact value, as Python's `json.loads` reads it (prompts re-render state
# floats, the playground shows response numbers).
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = "1"
toml = "1"
tower = "0.5"
tower-http = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# `ardana-server`'s build script embeds the playground through memory-serve, which brotli-compresses and hashes every
# asset (onnxruntime-web's 26.8 MB WASM among them). Release builds compile a build script's dependencies without
# optimisation, which stretches that to minutes; optimised, the two crates doing the work take seconds.
[profile.release.package.brotli]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

# Candle's CPU kernels unoptimised take minutes over one prompt of a 1.7B checkpoint, so the dev profile `cargo test`
# builds (the real-model tests among them) optimises them and the gemm crates they call; the workspace stays debug.
[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.candle-transformers]
opt-level = 3

[profile.dev.package.gemm]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f32]
opt-level = 3

[profile.dev.package.gemm-f16]
opt-level = 3

[profile.dev.package.half]
opt-level = 3
