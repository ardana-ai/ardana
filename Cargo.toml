[workspace]
resolver = "3"
members = [
    "crates/ardana",
    "crates/ardana-api",
    "crates/ardana-core",
    "crates/ardana-llama",
    "crates/ardana-registry",
    "crates/ardana-server",
    "crates/ardana-playground",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ardana-api = { path = "crates/ardana-api" }
ardana-core = { path = "crates/ardana-core" }
ardana-llama = { path = "crates/ardana-llama" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
llama-cpp-2 = { version = "=0.1.157", default-features = false }
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
