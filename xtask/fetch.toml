# Everything `cargo xtask fetch` installs into the gitignored tmp/, and
# `cargo xtask fetch --check` verifies: the tools, and every `[[hf]]` file but
# the weights. The weights are pinned here too; the end-to-end suite that reads
# them downloads them and removes them again (`xtask/src/hub.rs`).
#
# [[tool]] fields:
#   name     crate name (`cargo`) or tool name (`github`)
#   version  a literal version, or `cargo-lock:<crate>` for the version Cargo.lock resolves
#   source   `cargo`: installed by `Sandbox::cargo_install` (CARGO_HOME=tmp/cargo, root tmp,
#            binaries in tmp/bin, recorded in tmp/.crates2.json)
#            `github`: the release archive at `url`, checked against `url`.sha256, extracted
#            to tmp/tools/<name>/<version>, with `path` inside it linked into tmp/bin
#            `git`: the repository at `url`, checked out at the full commit `rev` into
#            tmp/src/<name> (research clones)
#            `uv-tool`: `uv tool install <name>==<version>` on a uv-managed Python 3.10+
#            into UV_TOOL_DIR, its executables in tmp/bin
#            `uv-venv`: a venv at tmp/<path> on a uv-managed Python 3.10+ holding
#            <name>==<version>, or, when `url` names a requirements source inside tmp/
#            (a research clone's pyproject.toml), that source's declared dependencies;
#            `version` then names the source's pinned revision
#            `npm`: `npm ci` in the repo directory `path` (package.json and its lock), which must
#            pin <name> at exactly `version` and hold it under `path`/node_modules
#            `local-copy`: the real home's file `url` (relative to it) copied, read only, to
#            tmp/<path>; checked to be executable and, while the source exists, identical
#
# [[hf]] fields:
#   repo      `org/name` on huggingface.co
#   revision  the full commit id the files come from; also written to `refs/main`
#   files     files downloaded into tmp/hf/hub/models--<org>--<name> in the Hub cache
#            layout (blobs/, snapshots/<revision>/, refs/main), each verified against
#            its LFS sha256 or git blob id. `fetch` and `fetch --tests` install all of
#            them but the weights (.gguf, .onnx, .onnx.data and .safetensors files),
#            which `cargo xtask e2e <suite>` downloads for the suite that names the
#            repository (`RUST_FIXTURES` and the weight lists in `xtask/src/e2e.rs`)
#            and removes when it ends
#   `cargo xtask onnx publish <name>` pins the ardana-ai repositories it uploads here.

