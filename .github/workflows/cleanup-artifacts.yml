# Deletes every artifact of a finished "Release" run (published, failed, cancelled or dry-run). Those artifacts only
# carry files between the run's jobs, and the GitHub Release keeps the published ones. release.yml is generated by
# dist, whose uploads set no `retention-days` and whose custom jobs run only after success, so the cleanup lives here.
# Workflows written by hand set `retention-days: 1` on their uploads instead.
name: Clean up release artifacts

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

jobs:
  delete:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Delete the run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | "\(.id) \(.name)"' |
            while read -r id name; do
              echo "deleting $name"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
