# Deletes every artifact of a finished "Release" run (published, failed, cancelled or dry-run). The artifacts only
# carry files between that run's jobs; the GitHub Release keeps the published files, so nothing is lost.
name: Clean up release artifacts

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

jobs:
  delete:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Delete the run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | "\(.id) \(.name)"' |
            while read -r id name; do
              echo "deleting $name"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
