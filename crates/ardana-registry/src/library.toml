# Ardana's model library: the short names `ardana pull`, `ardana run` and the API resolve, as Ollama's library does.
# Each name is a Hugging Face GGUF repository read at its `main` commit; `<name>:<quant>` picks another GGUF of the
# same repository, matched like an `hf.co/` quant. A new model family is one `[[model]]` entry.
#
# name          the registry name the model is pulled as (`<name>:<quant>` for another quant)
# weights       `hf.co/<org>/<repo>`, the GGUF repository
# quant         the GGUF a bare name picks
# size          that GGUF's size in bytes, shown before the first pull
# release_date  the model's release: `decider_config.json`'s `release_date` for decider models, else the day the
#               upstream model repository was created
# tokenizer     `hf.co/<org>/<repo>` of the tokenizer and chat template, when the GGUF repository has none
# layout        `plain` or `chat`; without it, `plain` with `decider_config.json`, else `chat`
# source        `hf.co/<org>/<repo>@<commit>`, the checkpoint `cargo xtask onnx convert <name>` builds the browser
#               variant from, and the GGUF too when `weights` is an ardana-ai repository
#
# [model.browser] is the model's browser variant, ONNX weights onnxruntime-web runs in a visitor's tab:
# weights       `hf.co/ardana-ai/<name>-ONNX`, the ONNX repository
# quant         `int4` or `int8`, the export recipe (docs/guidelines/onnx.md)
# size          the bytes a browser downloads: `model.onnx`, `model.onnx.data` and `tokenizer.json`
#
# `browser_default` is the browser model a playground offers first.
#
# Sizes, dates and files were read from the Hugging Face API on 2026-09-28: every decider GGUF repository Mapika
# publishes (`/api/models?author=Mapika`), and the two stock instruct models the plan reads zero-shot. The sizes of
# the browser variants and of the ardana-ai GGUFs are the bytes `cargo xtask onnx convert` built and recorded.

default = "decider-2b"
browser_default = "decider-0.8b"

[[model]]
name = "decider-2b"
weights = "hf.co/Mapika/decider-2b-GGUF"
quant = "Q4_K_M"
size = 1_274_396_800
release_date = "2026-09-24"
source = "hf.co/Mapika/decider-2b@533964dae8be954c5b5e19fa4948e48408094c1e"

[model.browser]
weights = "hf.co/ardana-ai/decider-2b-ONNX"
quant = "int4"
