[package]
name = "ardana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The one package dist releases (`dist-workspace.toml`); the workspace stays `publish = false`.
[package.metadata.dist]
dist = true

[features]
cuda = ["ardana-llama/cuda"]
vulkan = ["ardana-llama/vulkan"]

[dependencies]
anyhow.workspace = true
ardana-api.workspace = true
ardana-candle.workspace = true
ardana-core.workspace = true
ardana-llama.workspace = true
ardana-registry.workspace = true
ardana-server.workspace = true
axoupdater.workspace = true
clap = { workspace = true, features = ["env"] }
flate2.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokenizers = { workspace = true, features = ["onig"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "macros", "process", "signal"] }

[dev-dependencies]
toml.workspace = true
