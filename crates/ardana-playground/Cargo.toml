[package]
name = "ardana-playground"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The standalone build `cargo xtask build-playground` makes, which no server serves: the page reads the library document
# from the URL the build names (`src/api.rs`), and the browser files come from their Hugging Face repositories.
standalone = []

[dependencies]
ardana-api.workspace = true
indexmap.workspace = true
js-sys.workspace = true
leptos.workspace = true
lz-str.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "AbortController",
    "AbortSignal",
    "Cache",
    "CacheStorage",
    "Clipboard",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Headers",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "Navigator",
    "Node",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "ReferrerPolicy",
    "Request",
    "RequestCache",
    "RequestInit",
    "ResizeObserver",
    "Response",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "DomRect",
    "DomTokenList",
    "FocusEvent",
    "FocusOptions",
    "Storage",
    "UrlSearchParams",
    "Window",
    "console",
] }
